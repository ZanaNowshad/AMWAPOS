name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2022
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
      # Public half of the update-signing key, compiled into the app. Without it
      # the app never checks for or installs updates.
      AMWAPOS_UPDATE_PUBKEY: ${{ vars.AMWAPOS_UPDATE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Bundle the WhatsApp/OCR sidecar (Node runtime + production modules)
        shell: pwsh
        run: |
          npm ci --omit=dev --prefix sidecar
          New-Item -ItemType Directory -Force src-tauri/resources/node | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/resources/node/node.exe
          node --version
      - run: cargo test --workspace
      - name: Require embedded WebView2 bootstrapper (offline tills)
        shell: pwsh
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($c.bundle.windows.webviewInstallMode.type -ne 'embedBootstrapper') { throw "webviewInstallMode must be embedBootstrapper" }
      - run: npx tauri build --bundles nsis
      # Authenticode signing runs only when a certificate is configured. Unsigned
      # builds are published as such and must not be deployed to stores unreviewed.
      - name: Sign installer
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          }
          Remove-Item $pfx
      - name: SBOM
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom-frontend.cdx.json
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item sbom-frontend.cdx.json out/
          # The devserver is a development tool and is not shipped.
          Get-ChildItem -Recurse -Filter "*.cdx.json" crates, src-tauri | Where-Object { $_.Directory.Name -ne "amwapos-devserver" } | ForEach-Object { Copy-Item $_.FullName ("out/sbom-" + $_.Directory.Name + ".cdx.json") }
      - name: Signed update manifest (latest.json)
        if: env.HAS_UPDATE_KEY == 'true'
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          $exe = Get-ChildItem out/*.exe | Select-Object -First 1
          $ver = "${{ github.ref_name }}".TrimStart("v")
          node scripts/sign-update.mjs --installer $exe.FullName --version $ver --url "$env:UPDATE_BASE_URL/$($exe.Name)" | Set-Content out/latest.json
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
