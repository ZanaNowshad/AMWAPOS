[package]
name = "amwapos-devserver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Development/test bridge: serves the UI and the command API over loopback HTTP. Not shipped."
publish = false

[dependencies]
amwapos-core = { path = "../amwapos-core" }
amwapos-hub = { path = "../amwapos-hub" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
