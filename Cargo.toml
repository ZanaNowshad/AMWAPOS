[workspace]
resolver = "2"
members = ["crates/amwapos-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-AMWAPOS-Proprietary"
rust-version = "1.80"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions"] }
argon2 = "0.5"
ulid = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
rand = "0.8"
hex = "0.4"
csv = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
fs4 = "1"
hmac = "0.12"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "unwind"
